name: Check PR title
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on:
      - codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-7.0
      - instance-size:medium
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/validate-pr-title
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
