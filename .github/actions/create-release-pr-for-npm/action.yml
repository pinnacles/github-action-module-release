name: Create Release PR for NPM
description: Create a pull request for releasing a new version of a npm.
inputs:
  base-branch:
    required: true
    description: The base branch
  version-file-path:
    description: The path to the version file. ex. lib/my_npm/package.json
    default: "package.json"
  commit-user-email:
    description: The email address of the user who created the commit
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  commit-user-name:
    description: The name of the user who created the commit
    default: "github-actions[bot]"
  tag-prefix:
    description: The tag prefix
    default: "v"
  pre-release:
    description: Whether the release is a pre-release
    default: false

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        ref: ${{ inputs.base-branch }}
        token: ${{ env.GITHUB_TOKEN }}
    - name: Conventional Changelog Action
      id: changelog
      uses: TriPSs/conventional-changelog-action@v6
      with:
        preset: conventionalcommits
        skip-version-file: true
        output-file: false
        git-branch: ${{ inputs.base-branch }}
        git-push: false
        skip-commit: true
        skip-tag: true
        tag-prefix: ${{ inputs.tag-prefix }}
        github-token: ${{ env.GITHUB_TOKEN }}
        pre-release: ${{ inputs.pre-release }}
    - name: Commit version up commit
      if: ${{ steps.changelog.outputs.skipped == 'false' }}
      env:
        VERSION: ${{ steps.changelog.outputs.version }}
        COMMIT_USER_EMAIL: ${{ inputs.commit-user-email }}
        COMMIT_USER_NAME: ${{ inputs.commit-user-name }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION_FILE_PATH: ${{ inputs.version-file-path }}
      run: |
        git config --local user.email "$COMMIT_USER_EMAIL"
        git config --local user.name "$COMMIT_USER_NAME"
        git checkout -b "release/$TAG_PREFIX$VERSION"
        sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" "$VERSION_FILE_PATH"
        git add "$VERSION_FILE_PATH"
        git commit -m "chore: bump version to v$VERSION"
        git push origin "release/$TAG_PREFIX$VERSION"
      shell: bash
    - name: Write changelog to file
      if: ${{ steps.changelog.outputs.skipped == 'false' }}
      # The changelog contains commit messages. With this shell the runner writes the run text to a file and cp copies
      # it, so no shell reads the text and backticks or $(...) in a commit message are never run as commands.
      # An env var cannot carry it: Linux rejects one env var larger than 128 KiB, and a changelog can be larger.
      shell: cp {0} /tmp/pr_body.txt
      run: |
        ${{ steps.changelog.outputs.clean_changelog }}
    - name: Create Pull Request
      if: ${{ steps.changelog.outputs.skipped == 'false' }}
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
        VERSION: ${{ steps.changelog.outputs.version }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        export LC_ALL=C.UTF-8
        MAX_BODY_CHARS=65000
        # Keep the old escaping of double quotes so the PR body text does not change.
        BODY=$(sed 's/"/\\"/g' /tmp/pr_body.txt)
        # GitHub rejects a PR body longer than 65,536 characters. Cut a long body and leave room for the note.
        if [ "${#BODY}" -gt "$MAX_BODY_CHARS" ]; then
          BODY="${BODY:0:MAX_BODY_CHARS}"$'\n\n'"(The changelog was cut because it is longer than the GitHub PR body limit.)"
        fi
        # A file, not --body, because Linux rejects one command argument larger than 128 KiB.
        printf '%s' "$BODY" > /tmp/pr_body.txt
        gh pr create --title "chore: Release version to v$VERSION" --body-file /tmp/pr_body.txt --base "$BASE_BRANCH" --head "release/$TAG_PREFIX$VERSION"
      shell: bash
